<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待办清单 · demo-app</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>待办清单</h1>
    <form id="add-form">
      <input id="todo-input" type="text" placeholder="要做什么？" autocomplete="off" />
      <button type="submit">添加</button>
    </form>
    <ul id="todo-list"></ul>
    <p class="meta" id="count">0 项待办</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
